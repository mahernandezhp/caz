<template>
    <lightning-card title="Agregar Miembro del Portal" icon-name="standard:user">
        <div class="slds-p-around_medium">
            <template if:true={error}>
                <div class="slds-text-color_error slds-m-bottom_small">{error}</div>
            </template>

            <template if:true={accountName}>
                <p class="slds-text-body_small slds-m-bottom_medium">
                    Cuenta: <strong>{accountName}</strong>
                </p>
            </template>

            <lightning-input
                label="Nombre"
                data-field="firstName"
                value={firstName}
                onchange={handleChange}
                class="slds-m-bottom_x-small">
            </lightning-input>

            <lightning-input
                label="Apellido"
                data-field="lastName"
                value={lastName}
                onchange={handleChange}
                required
                class="slds-m-bottom_x-small">
            </lightning-input>

            <lightning-input
                type="email"
                label="Email"
                data-field="email"
                value={email}
                onchange={handleChange}
                required
                class="slds-m-bottom_x-small">
            </lightning-input>

            <lightning-combobox
                label="Perfil"
                data-field="profileId"
                value={profileId}
                options={profileOptions}
                onchange={handleChange}
                required
                placeholder="Selecciona un perfil"
                class="slds-m-bottom_x-small">
            </lightning-combobox>

            <lightning-combobox
                label="Rol"
                data-field="roleId"
                value={roleId}
                options={roleOptions}
                onchange={handleChange}
                placeholder="Selecciona un rol"
                class="slds-m-bottom_x-small">
            </lightning-combobox>

            <lightning-dual-listbox
                label="Permission Sets"
                data-field="permissionSets"
                options={permissionSetOptions}
                value={permissionSetIds}
                onchange={handleChange}
                source-label="Disponibles"
                selected-label="Asignados"
                class="slds-m-bottom_medium">
            </lightning-dual-listbox>

            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Crear Usuario"
                    onclick={handleSave}
                    disabled={isLoading}>
                </lightning-button>
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Creando..."></lightning-spinner>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
